  <style>
    /* Launch splash: inline so it paints on the very first frame (same base colour as the system splash) */
    html { background: #1f3449; }
    .splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: radial-gradient(70% 45% at 50% 44%, #35587a 0%, #1f3449 70%); transition: opacity .45s ease, visibility .45s; }
    .splash.hide { opacity: 0; visibility: hidden; }
    .splash svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .splash-title { position: absolute; left: 0; right: 0; top: 13vh; text-align: center; font-family: "Playfair Display", Georgia, serif; animation: sp-fade .5s ease-out both; }
    .splash-title h1 { margin: 0; font-size: 36px; font-weight: 600; color: #f6efe1; }
    .splash-title h1 em { color: #e9c97e; font-style: italic; }
    .splash-title p { margin: 8px 0 0; font: 600 11px/1 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; letter-spacing: .34em; color: rgba(241, 234, 217, .7); }
    .sp-ball { transform-box: fill-box; transform-origin: 50% 50%; animation: sp-roll 1.1s cubic-bezier(.35, .05, .55, 1) .15s both; }
    .sp-ball .sp-spin { transform-box: fill-box; transform-origin: 50% 50%; animation: sp-spin .95s linear .15s both; }
    .sp-pin { transform-box: fill-box; transform-origin: 50% 100%; animation: sp-fly .9s cubic-bezier(.2, .7, .3, 1) 1.1s both; }
    .sp-burst { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: sp-burst .6s ease-out 1.08s both; }
    .sp-strike { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: sp-pop .55s cubic-bezier(.2, 1.6, .4, 1) 1.2s both; }
    @keyframes sp-fade { from { opacity: 0; transform: translateY(8px); } }
    @keyframes sp-roll { 0% { transform: translate(0, 0) scale(1); } 85% { transform: translate(0, -372px) scale(.26); opacity: 1; } 100% { transform: translate(0, -392px) scale(.2); opacity: 0; } }
    @keyframes sp-spin { to { transform: rotate(-540deg); } }
    @keyframes sp-fly { 75% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
    @keyframes sp-burst { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6); } }
    @keyframes sp-pop { 0% { opacity: 0; transform: scale(.3) rotate(-8deg); } 100% { opacity: 1; transform: scale(1) rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { .splash * { animation: none !important; } }
  </style>
