<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Best Bowling</title>
  <meta name="description" content="Best Bowling — 볼링 점수 기록, 팀전, 핸디캡, 비용 정산">
  <!-- Keep equal to manifest theme_color in every theme: installed Chrome apps paint the status bar from the manifest
       but pick light/dark icons from this tag, so a mismatch hides the clock and battery icons. -->
  <meta name="theme-color" content="#f5f2ec">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Best Bowling">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Launch: continues the phone's own icon screen (same #1f3449 background, icon centred at 300dp) for a moment.
       Inline so it paints on the first frame. */
    .launch { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #1f3449; transition: opacity .35s ease, visibility .35s; }
    .launch.hide { opacity: 0; visibility: hidden; }
    .launch img { width: min(300px, 80vw); height: auto; }
  </style>
</head>
<body>
  <div id="launch" class="launch" aria-hidden="true"><img src="icons/icon.svg" alt=""></div>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt=""><span>Best <em>Bowling</em></span></div>
    <div id="topcal" class="topcal"></div>
  </header>
  <main id="view"></main>
  <div id="keypad" class="keypad" hidden></div>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="importFile" type="file" accept="application/json,.json,text/plain,.txt" hidden>
  <script src="js/docs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
