<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Best Bowling — 개인정보처리방침 / Privacy Policy</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f5f2ec; --surface: #fff; --text: #1b1d24; --muted: #847d70; --gold: #a07a38; --line: rgba(28, 30, 38, .1); }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c0e13; --surface: #151922; --text: #ece8df; --muted: #8f8a80; --gold: #dcbb78; --line: rgba(255, 255, 255, .08); } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    header img { width: 48px; height: 48px; border-radius: 12px; }
    header h1 { font: 600 24px Georgia, serif; margin: 0; }
    header h1 em { color: var(--gold); }
    nav { display: flex; gap: 8px; margin-bottom: 18px; }
    nav a { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; }
    section { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px 22px 18px; margin-bottom: 18px; }
    h2 { font-size: 20px; margin: 18px 0 4px; }
    h3 { font-size: 16px; margin: 20px 0 4px; }
    p, li { color: var(--text); }
    .doc-date { color: var(--muted); font-size: 13px; margin-top: 0; }
    a { color: var(--gold); }
  </style>
</head>
<body>
  <main>
    <header><img src="icons/icon.svg" alt=""><h1>Best <em>Bowling</em></h1></header>
    <nav><a href="#ko">한국어</a><a href="#en">English</a></nav>
    <section id="ko"></section>
    <section id="en"></section>
  </main>
  <script src="js/docs.js"></script>
  <script src="js/privacy.js"></script>
</body>
</html>
